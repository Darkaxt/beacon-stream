name: CI

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Beacon.slnx
      - run: dotnet format Beacon.slnx --verify-no-changes --no-restore
      - run: dotnet build Beacon.slnx -warnaserror --no-restore
      - run: dotnet test Beacon.slnx --no-build

  client-lab:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.54.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            src/Beacon.ClientLab/pnpm-lock.yaml
            tests/Beacon.ClientLab.Playwright/pnpm-lock.yaml
      - run: pnpm --dir src/Beacon.ClientLab install --frozen-lockfile
      - run: pnpm --dir src/Beacon.ClientLab lint
      - run: pnpm --dir src/Beacon.ClientLab test
      - run: pnpm --dir tests/Beacon.ClientLab.Playwright install --frozen-lockfile
      - run: pnpm --dir tests/Beacon.ClientLab.Playwright lint
      - run: pnpm --dir tests/Beacon.ClientLab.Playwright test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"
      - run: echo "BEACON_ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: gradle -p src/Beacon.Android clean test assembleDebug assembleRelease assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            bash scripts/test-native-android-protocol.sh
            gradle -p src/Beacon.Android connectedDebugAndroidTest

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: ./scripts/build-native-windows.ps1
      - shell: pwsh
        run: ./scripts/test-stream-worker-integration.ps1
